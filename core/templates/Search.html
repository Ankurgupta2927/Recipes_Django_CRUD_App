<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Search</title>
    
    <!-- Google Font: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS (Optional if you want to include it directly in the HTML file) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Global Font */
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        /* Set up the blurry background */
        .blur-background {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('your-image-url.jpg'); /* Replace with your image */
            background-size: cover;
            background-position: center;
            filter: blur(8px);
            z-index: -1;
        }

        /* Add opacity to the content container */
        .container-fluid {
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 15px;
        }

        /* Adding animation for fading in */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animated {
            animation-duration: 0.8s;
            animation-fill-mode: both;
        }

        .fadeInUp {
            animation-name: fadeInUp;
        }

        /* Card Styling */
        .recipe-card {
            margin-bottom: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        /* Styling for the recipe images */
        .recipe-card img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }

        /* Buttons hover effect */
        .btn {
            transition: all 0.3s ease-in-out;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Responsive for small screens */
        @media (max-width: 768px) {
            .table-responsive {
                overflow-x: auto;
            }
        }

    </style>
</head>
<body>
    <div class="container-fluid blur-background"></div>

    <div class="container mt-5">
        <!-- Search Form -->
        <form>
            <div class="row justify-content-center">
                <div class="col-md-6 col-12">
                    <div class="input-group mb-4 animated fadeInUp">
                        <label for="search" class="form-label"></label>
                        <input class="form-control" id="Search" type="text" name="search" placeholder="Search for a recipe">
                        <button type="submit" class="btn btn-success">Search Recipe</button>
                    </div>
                </div>
            </div>
        </form>

        <!-- Recipe Cards -->
        <div class="row animated fadeInUp">
            {% for receipe in receipes %}
            <div class="col-md-4 col-sm-6 col-12">
                <div class="card recipe-card">
                    <img src="/media/{{ receipe.receipe_image }}" class="card-img-top" alt="Recipe Image">
                    <div class="card-body">
                        <h5 class="card-title">{{ receipe.receipe_name }}</h5>
                        <p class="card-text">{{ receipe.receipe_description }}</p>
                        <div class="d-flex justify-content-between">
                            <a href="/delete_receipe/{{ receipe.id }}/" class="btn btn-danger btn-sm">Delete</a>
                            <a href="/update_receipe/{{ receipe.id }}/" class="btn btn-success btn-sm">Edit</a>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <!-- Bootstrap JS (Optional if you want to include it directly in the HTML file) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
