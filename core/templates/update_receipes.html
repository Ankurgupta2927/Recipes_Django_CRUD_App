{% extends 'base.html' %}



{% block content %}
<div class="container mt-5">
    <form class="col-6 mx-auto card p-3 shadow-lg" method="POST" enctype="multipart/form-data">
        <h1>Update Receipe</h1>
        {% csrf_token %}
        <div class="mb-3">
            <label for="ReceipeName" class="form-label">Receipe name</label>
            <input type="text" class="form-control" value="{{receipe.receipe_name}}" id="receipe_name" name="receipe_name">
        </div>
        <div class="mb-3">
            <label for="Description" class="form-label">Description </label>
            <textarea class="form-control" id="receipe_description" value=""  name="receipe_description" "">{{receipe.receipe_description}}</textarea>
        </div>
        <div class="mb-3">
            <label for="Image" class="form-label">Image</label>
            <input type="file" class="form-control" id="receipe_image" value="{{receipe.receipe_image}}" name="receipe_image">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">Check me out</label>
        </div>
        <button type="submit" class="btn btn-success">Update Receipe</button>
    </form>
</div>


{% endblock %}
